name: C SDK and interoperability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [static, shared, sanitizers, nocompression]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libbz2-dev clang
      - name: Configure
        shell: bash
        run: |
          opts=(-DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Debug)
          if [ '${{ matrix.variant }}' = shared ]; then opts+=(-DBUILD_SHARED_LIBS=ON); fi
          if [ '${{ matrix.variant }}' = sanitizers ]; then opts+=(-DRNC_SANITIZERS=ON -DCMAKE_C_COMPILER=clang); fi
          if [ '${{ matrix.variant }}' = nocompression ]; then opts+=(-DRNC_COMPRESSION=OFF); fi
          cmake -S . -B build -G Ninja "${opts[@]}"
      - run: cmake --build build
      - name: Unit, process and relocated SDK tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
  rns:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libbz2-dev python3-dev python3-venv
      - name: Prepare unmodified RNS 1.5.5 oracle
        run: |
          git clone https://github.com/markqvist/Reticulum.git "$RUNNER_TEMP/rns"
          git -C "$RUNNER_TEMP/rns" checkout e40191b3d193b46b7f2d8a44424a594cd758839b
          python3 -m venv "$RUNNER_TEMP/rns-env"
          "$RUNNER_TEMP/rns-env/bin/pip" install 'cryptography>=3.4.7' 'pyserial==3.5'
          # LXMF supplies the stamp functions RNS uses for interface discovery
          "$RUNNER_TEMP/rns-env/bin/pip" install --no-deps 'lxmf==1.2.1'
      - run: >-
          cmake -S . -B build -G Ninja -DRNC_INTEROP_TESTS=ON
          -DRNC_REFERENCE_DIR="$RUNNER_TEMP/rns"
          -DPython3_EXECUTABLE="$RUNNER_TEMP/rns-env/bin/python"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  leviculum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libbz2-dev pkg-config libdbus-1-dev libudev-dev
      - name: Prepare pinned, unmodified Leviculum oracle
        run: |
          git clone https://codeberg.org/Lew_Palm/leviculum.git "$RUNNER_TEMP/leviculum"
          git -C "$RUNNER_TEMP/leviculum" checkout 395edd42fbbffcdfb438fcd80afa17668459d331
          rustup toolchain install 1.97.1 --profile minimal
          cd "$RUNNER_TEMP/leviculum"
          cargo +1.97.1 build --locked -p leviculum-ffi --release --target x86_64-unknown-linux-gnu
          ln -s libleviculum.so target/x86_64-unknown-linux-gnu/release/libleviculum.so.0
      - run: >-
          cmake -S . -B build -G Ninja -DRNC_LEVICULUM_TESTS=ON
          -DRNC_LEVICULUM_REFERENCE_DIR="$RUNNER_TEMP/leviculum"
          -DRNC_LEVICULUM_LIBRARY="$RUNNER_TEMP/leviculum/target/x86_64-unknown-linux-gnu/release/libleviculum.so"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  # Microcontroller firmware: the version check and the host test of the firmware logic,
  # the ESP-IDF builds (esp32, esp32s3, in the pinned Docker image) and the PlatformIO
  # builds (two board groups, with the PlatformIO packages cached). The build scripts are
  # the same ones the release workflow runs.
  mcu:
    name: mcu ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: host}
          - {name: esp-idf-esp32, chip: esp32}
          - {name: esp-idf-esp32s3, chip: esp32s3}
          - {name: platformio-esp32, group: esp32, envs: 'heltec_wifi_lora_32_V3 heltec_wifi_lora_32_V2 ttgo_t_beam lilygo_t3_s3'}
          - {name: platformio-nrf52, group: nrf52, envs: 'wiscore_rak4631 heltec_t114 lilygo_t_echo'}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Version consistency
        run: .github/scripts/check-version.sh
      - name: Host test of the firmware logic
        if: matrix.name == 'host'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libbz2-dev
          cmake -S . -B build -G Ninja
          cmake --build build --target reticulum-c-node echo_client
          ctest --test-dir build --output-on-failure -L 'mcu|version'
      - name: ESP-IDF build
        if: matrix.chip != ''
        run: mcu/build-esp-idf.sh --docker ${{ matrix.chip }} out/${{ matrix.chip }}
      - name: PlatformIO packages cache
        if: matrix.group != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.group }}-${{ hashFiles('mcu/build-platformio.sh', 'mcu/platformio/platformio.ini', 'mcu/platformio/boards/*.json') }}
          restore-keys: platformio-${{ matrix.group }}-
      - name: PlatformIO build
        if: matrix.group != ''
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv
          mcu/build-platformio.sh ${{ matrix.envs }} out
      - name: Size report
        if: matrix.group != ''
        run: cat out/size-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name != 'host'
        with:
          name: mcu-${{ matrix.name }}
          path: |
            out
            !out/*/build
            !out/.pio-venv
          if-no-files-found: error
          retention-days: 7
