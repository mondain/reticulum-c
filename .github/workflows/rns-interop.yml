name: Reference RNS interoperability
# The interoperability suite against the unmodified reference Reticulum is slow, so it is not
# part of the push and pull request checks (ci.yml). It runs when a release tag is pushed, and
# on demand: Actions -> Reference RNS interoperability -> Run workflow, on any branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rns:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libbz2-dev python3-dev python3-venv
      - name: Prepare unmodified RNS 1.6.1 oracle
        run: |
          git clone https://github.com/markqvist/Reticulum.git "$RUNNER_TEMP/rns"
          git -C "$RUNNER_TEMP/rns" checkout f55c0c6ea618ebae33e7d3ab2e37b200ce0b0d81
          python3 -m venv "$RUNNER_TEMP/rns-env"
          "$RUNNER_TEMP/rns-env/bin/pip" install 'cryptography>=3.4.7' 'pyserial==3.5'
          # LXMF supplies the stamp functions RNS uses for interface discovery
          "$RUNNER_TEMP/rns-env/bin/pip" install --no-deps 'lxmf==1.2.1'
      - run: >-
          cmake -S . -B build -G Ninja -DRNC_INTEROP_TESTS=ON
          -DRNC_REFERENCE_DIR="$RUNNER_TEMP/rns"
          -DPython3_EXECUTABLE="$RUNNER_TEMP/rns-env/bin/python"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
