name: Release
# Pushing a tag such as v0.2.1 builds self-contained Linux archives for the CPUs
# Reticulum nodes commonly run on (PCs and servers, 64-bit and 32-bit Raspberry
# Pis and similar boards), the example firmware for ESP32, ESP32-S3 and nRF52840
# boards, an ESP-IDF component and a PlatformIO library, and publishes them as a
# GitHub release. Run by hand (workflow_dispatch) it only builds, for a trial, and
# keeps the archives as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a trial build (no release is created)
        default: v0.0.0-trial
permissions:
  contents: read
jobs:
  # Runs before everything else: the tag must name the version in CMakeLists.txt and every
  # file that repeats it must agree (library.json, idf_component.yml, ...). A manual trial
  # run has no tag, so only the files are compared.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Tag and version files
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            .github/scripts/check-version.sh "$REF_NAME"
          else
            .github/scripts/check-version.sh
          fi
  build:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - {target: x86_64, platform: linux/amd64, skip: reticulum_interop}
          - {target: aarch64, platform: linux/arm64, skip: 'network|pty|reticulum_interop'}
          - {target: armv7, platform: linux/arm/v7, skip: 'network|pty|reticulum_interop'}
          - {target: armv6, platform: linux/arm/v6, skip: 'network|pty|reticulum_interop'}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; else version="$INPUT_VERSION"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Emulation for the other CPUs
        if: matrix.target != 'x86_64'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build, test and package
        run: >-
          docker run --rm --platform ${{ matrix.platform }} -e GITHUB_SHA
          -v "$PWD":/src:ro -v "$PWD/out":/out alpine:3.20
          sh /src/.github/scripts/release-build.sh ${{ matrix.target }} "$VERSION" /out '${{ matrix.skip }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  # Example firmware, the same builds the CI workflow runs (mcu job): ESP-IDF images for
  # esp32 and esp32s3, in the pinned Docker image, and the PlatformIO environments.
  firmware-esp-idf:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        chip: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: mcu/build-esp-idf.sh --docker ${{ matrix.chip }} out/${{ matrix.chip }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fw-esp-idf-${{ matrix.chip }}
          path: |
            out/${{ matrix.chip }}
            !out/${{ matrix.chip }}/build
          if-no-files-found: error
          retention-days: 14
  firmware-platformio:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - {group: esp32, envs: 'heltec_wifi_lora_32_V3 heltec_wifi_lora_32_V2 ttgo_t_beam lilygo_t3_s3'}
          - {group: nrf52, envs: 'wiscore_rak4631 heltec_t114 lilygo_t_echo'}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.group }}-${{ hashFiles('mcu/build-platformio.sh', 'mcu/platformio/platformio.ini', 'mcu/platformio/boards/*.json') }}
          restore-keys: platformio-${{ matrix.group }}-
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv
          mcu/build-platformio.sh ${{ matrix.envs }} out
      - run: cat out/size-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fw-platformio-${{ matrix.group }}
          path: out
          if-no-files-found: error
          retention-days: 14
  # Per-board firmware archives, the ESP-IDF component and the PlatformIO library. Runs
  # for a manual trial too (the archives stay as workflow artifacts).
  package-mcu:
    needs: [version, firmware-esp-idf, firmware-platformio]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fw-*
          path: fw
      - name: Package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; else version="$INPUT_VERSION"; fi
          for d in fw/fw-esp-idf-*; do
            .github/scripts/package-mcu.sh board "$version" "esp-idf-${d##*fw-esp-idf-}" "$d" dist
          done
          for d in fw/fw-platformio-*/*/; do
            d=${d%/}
            [ -f "$d/flash.txt" ] || continue
            board=$(basename "$d" | tr 'A-Z' 'a-z')
            .github/scripts/package-mcu.sh board "$version" "$board" "$d" dist
          done
          .github/scripts/package-mcu.sh sources "$version" dist
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-mcu
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  release:
    needs: [version, build, firmware-esp-idf, firmware-platformio, package-mcu]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          ## Linux builds

          Self-contained Linux builds (musl, fully static: OpenSSL and bzip2 are linked in, nothing to install on the device).

          | Archive | Runs on |
          | --- | --- |
          | `linux-x86_64-musl` | PCs, servers, virtual machines |
          | `linux-aarch64-musl` | Raspberry Pi 3/4/5 and Zero 2 with a 64-bit OS, Jetson, Orange Pi and similar |
          | `linux-armv7-musl` | Raspberry Pi 2/3/Zero 2 with a 32-bit OS and similar |
          | `linux-armv6-musl` | Raspberry Pi Zero and 1 (also runs on the armv7 boards) |

          Each archive holds `bin/` (the node daemon and tools), `include/` and `lib/` (static libraries, OpenSSL and bzip2 for static linking, a CMake package), `BUILDINFO` and the documentation. To link the SDK from CMake: `-DCMAKE_PREFIX_PATH=<unpacked directory> -DOPENSSL_USE_STATIC_LIBS=ON`. The Linux library needs a POSIX host with OpenSSL; use these builds on the computer a radio is attached to.

          ## Microcontroller firmware (example node, serial interface; Wi-Fi TCP on ESP32 once provisioned; optional LoRa radio, off until configured)

          `reticulum-c-<version>-mcu-<board>.zip` holds the firmware images, `flash.txt` with the exact flashing commands for that board, `BUILDINFO` (version, commit, toolchain versions), the manual and a README. The firmware is a Reticulum leaf node with one HDLC serial interface (the Reticulum SerialInterface framing): a host running reticulum-c-node or rnsd with the board as a SerialInterface routes between the board and the network. It announces `reticulum_c.mcu.example` and answers `/echo` and `/info`. It uses the portable crypto backend and the small mcu capacity profile (no OpenSSL).

          **Wi-Fi (ESP32 and ESP32-S3 archives).** The images start in serial mode and contain no Wi-Fi credentials. To join a network instead, provision the board after flashing: run `tools/wifi-config.sh` from the archive (writes the Wi-Fi settings as an NVS image with esptool, no console needed; `--arduino` for the PlatformIO archives, which replaces their NVS partition and so their identity), or send the line `rnc-config` on the serial port within 2 seconds after reset (or press BOOT) and use the `set`/`save`/`reboot` console. The board then connects as a TCP client to a node's TCPServerInterface (same HDLC framing). The TCP link is plaintext and unauthenticated at the transport level and the credentials are stored unencrypted in flash; `MANUAL.txt` has the details. The nRF52 archives have no Wi-Fi.

          **LoRa radio (the seven PlatformIO board archives; new, never tried on air).** Each of those images contains a driver for its board's radio (SX1262 on the Heltec V3, T3-S3, RAK4631, T114 and T-Echo; SX1276 on the Heltec V2 and the T-Beam v1.0/1.1) and a Reticulum LoRa interface whose over-the-air format is meant to be compatible with stock RNodes on the same frequency and modem settings (header byte with sequence nibble and split flag, packets above 254 bytes in two frames, private-network sync word, CRC on, explicit header). `lora.mode leaf` makes LoRa the node's only interface; `lora.mode gateway` adds it to the serial or Wi-Fi interface with Reticulum transport on. **The radio is off, and never transmits, until you have set the mode and all of frequency, bandwidth, spreading factor, coding rate and transmit power** (console `set lora.freq 868.1` ... or `tools/wifi-config.sh --lora-mode ...`); no default settings are in any image. **You are responsible for a legal frequency, power and duty cycle** where you use the board; the power setting is the power at the chip's output. The airtime budget defaults to 1% of every hour. This has been tested only on the host, against software models of the radio chips and a simulated channel: nothing has been run on a real radio or exchanged with a real RNode. The ESP-IDF archives are generic images without a board selection and have no radio; select a LoRa board in `idf.py menuconfig` and build from source to get one. The LilyGo T-Beam Supreme (needs its AXP2101 power chip set up) and the T-Beam v1.2 are not supported.

          | Archive | Board | Build |
          | --- | --- | --- |
          | `mcu-esp-idf-esp32` | ESP32 boards: Heltec WiFi LoRa 32 V2, LilyGo T-Beam, TTGO LoRa32 and similar | ESP-IDF 5.4.4 |
          | `mcu-esp-idf-esp32s3` | ESP32-S3 boards: Heltec WiFi LoRa 32 V3, T-Beam Supreme, T3-S3, T-Deck and similar | ESP-IDF 5.4.4 |
          | `mcu-heltec_wifi_lora_32_v3`, `mcu-heltec_wifi_lora_32_v2`, `mcu-ttgo_t_beam`, `mcu-lilygo_t3_s3` | the named ESP32 / ESP32-S3 boards | Arduino (PlatformIO) |
          | `mcu-wiscore_rak4631`, `mcu-heltec_t114`, `mcu-lilygo_t_echo` | RAKwireless RAK4631, Heltec Mesh Node T114, LilyGo T-Echo (nRF52840; UF2 and DFU files) | Arduino (PlatformIO) |

          `esp-idf-component.tar.gz` is the protocol core and the example application as ESP-IDF components (use it with `EXTRA_COMPONENT_DIRS`). `platformio-library.tar.gz` is the same as a PlatformIO library (`library.json`; `lib_deps = file:///path`). Both are source archives.

          **Limits.** The boards talk to a host over serial or USB (or, on ESP32 once provisioned, over Wi-Fi and TCP), and over LoRa once configured (see above); they have no Bluetooth. The firmware has not been tested on hardware: it builds in CI and the same application logic passes the host tests against reticulum-c-node and the reference Reticulum. The nRF52 board definitions for the RAK4631, T114 and T-Echo are derived from the Adafruit nRF52840 Feather and assume the Adafruit bootloader. It is a leaf node (no forwarding) unless the LoRa gateway mode is configured.

          Check every download with `sha256sum -c SHA256SUMS`.
          NOTES
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes "${flags[@]}"
