; reticulum-c example firmware for ESP32 / ESP32-S3 and nRF52840 boards (Arduino framework).
; Build one board:   pio run -e heltec_wifi_lora_32_V3
; Build everything:  mcu/build-platformio.sh   (installs the pinned PlatformIO, collects artifacts)
; See README.txt in this directory. PlatformIO itself is pinned to 6.1.19 by
; mcu/build-platformio.sh and ../../.github; the platforms below are pinned here.

[platformio]
; the sketch is src/main.cpp; the board JSONs of boards without an official definition
; (RAK4631, Heltec T114, LilyGo T-Echo) are in boards/
boards_dir = boards
default_envs = heltec_wifi_lora_32_V3

; ---- shared ----------------------------------------------------------------
[common]
framework = arduino
monitor_speed = 115200
; The reticulum-c library is this repository (library.json at its root). Inside the
; repository a symlink is used; from another project use
;   lib_deps = file:///path/to/reticulum-c      or
;   lib_deps = https://github.com/mondain/reticulum-c.git#v0.2.0
lib_deps = symlink://../..
build_flags =
    -Wall
    -Wno-unused-parameter
    -DRNC_MCU_FIRMWARE_BOARD=\"${PIOENV}\"
lib_ldf_mode = chain
; collects the flashable files in .pio/build/<env>/artifacts/
extra_scripts = post:scripts/artifacts.py

; ---- ESP32 (espressif32 6.12.0 = arduino-esp32 2.0.17, ESP-IDF 4.4) ---------------
[esp32_base]
extends = common
platform = espressif32@6.12.0
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DRNC_MCU_STACK_BYTES=16384
; native-USB boards define Serial as USB CDC; UART bridge boards use UART0.

[env:heltec_wifi_lora_32_V3]
extends = esp32_base
board = heltec_wifi_lora_32_V3
; ESP32-S3, CP2102 bridge on UART0

[env:heltec_wifi_lora_32_V2]
extends = esp32_base
board = heltec_wifi_lora_32_V2
; ESP32, CP2102 bridge on UART0

[env:ttgo_t_beam]
extends = esp32_base
board = ttgo-t-beam
; LilyGo T-Beam (ESP32), CP2104 bridge on UART0

[env:lilygo_t3_s3]
extends = esp32_base
board = lilygo-t3-s3
; LilyGo T3-S3 (ESP32-S3), native USB: Serial is USB CDC (ARDUINO_USB_CDC_ON_BOOT=1)

; ---- nRF52840 (nordicnrf52 10.10.0 = framework-arduinoadafruitnrf52 1.10700.0) ----
; Serial is the native USB CDC (TinyUSB). The boards boot the Adafruit nRF52 bootloader
; (UF2 drag and drop, or DFU over serial). The firmware is built for the S140 6.1.1
; SoftDevice memory map that bootloader expects (it does not enable the SoftDevice).
[nrf52_base]
extends = common
platform = nordicnrf52@10.10.0
build_flags =
    ${common.build_flags}
    -DRNC_MCU_STACK_BYTES=16384

[env:wiscore_rak4631]
extends = nrf52_base
board = wiscore_rak4631

[env:heltec_t114]
extends = nrf52_base
board = heltec_t114

[env:lilygo_t_echo]
extends = nrf52_base
board = lilygo_t_echo
